# Static site: no build step, publish the repository root.
[build]
  publish = "."
  # Cache-busting: stamp this deploy's commit into the script/stylesheet URLs in index.html
  # (/js/cabinet.js?v=__V__ -> ?v=<commit>), so no browser or CDN can keep running old code.
  command = "sed -i \"s/__V__/${COMMIT_REF:-dev}/g\" index.html"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Every game has its own address (/snake, /breakout, ...). Real files are served as-is; any
# other path gets index.html (status 200, not a redirect), whose router opens that game.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
